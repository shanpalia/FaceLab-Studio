workflows:
  android-release-apk:
    name: FaceLab Studio Release APK
    max_build_duration: 60
    environment:
      java: 17
      android_signing:
        - paliaapk-release
    scripts:
      - name: Build signed FaceLab Studio APK
        script: |
          set -e
          gradle --version
          gradle --no-daemon assembleRelease
          mkdir -p app/build/outputs/apk/release
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/FaceLab-Studio-v1.0.0.apk
    artifacts:
      - app/build/outputs/apk/release/FaceLab-Studio-v*.apk
