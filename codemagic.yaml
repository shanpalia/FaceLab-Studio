workflows:
  android-release-apk:
    name: FaceLab Studio Signed Release APK
    max_build_duration: 60
    instance_type: linux
    environment:
      java: 17
      android_signing:
        - keystore_reference: paliaapk-release
    scripts:
      - name: Build signed release APK
        script: |
          gradle --version
          gradle --no-daemon assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
