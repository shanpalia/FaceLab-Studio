workflows:
  android-debug-apk:
    name: FaceLab Studio Android APK
    max_build_duration: 60
    instance_type: linux
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients: []
